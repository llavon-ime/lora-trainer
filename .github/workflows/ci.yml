name: lora-trainer-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.*
      - run: dotnet restore Llavon.Lora.slnx --configfile NuGet.Config --runtime ${{ matrix.rid }}
      - run: dotnet build Llavon.Lora.slnx -c Release --no-restore
      - run: dotnet test tests/Llavon.Lora.Tests/Llavon.Lora.Tests.csproj -c Release --runtime ${{ matrix.rid }} --no-restore
      - name: Build Windows web installer
        if: runner.os == 'Windows'
        run: dotnet publish src/Llavon.Lora.Installer/Llavon.Lora.Installer.csproj -c Release

  # Metal runs on macOS 15 on purpose: the macOS 26 images have a Metal backend
  # whose results disagree with real hardware (actions/runner-images#14380), and
  # the test would be meaningless there.
  metal:
    name: macOS Metal (MPS) smoke test
    runs-on: macos-15
    env:
      LLAVON_LORA_REQUIRE_MPS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.*
      - run: dotnet restore tests/Llavon.Lora.Tests/Llavon.Lora.Tests.csproj --configfile NuGet.Config --runtime osx-arm64
      - run: dotnet build tests/Llavon.Lora.Tests/Llavon.Lora.Tests.csproj -c Release --no-restore
      - run: dotnet test tests/Llavon.Lora.Tests/Llavon.Lora.Tests.csproj -c Release --runtime osx-arm64 --no-restore --filter FullyQualifiedName~AcceleratorTests

  # The GPU backends link no NuGet native package, so this job builds them
  # without the multi-GB libtorch and checks that the applications still start.
  # A machine with the GPU and the libtorch fetched by
  # `llavon-lora fetch-libtorch` trains with --device cuda.
  gpu-backends:
    name: Linux GPU backend builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.*
      - name: Restore the ROCm backend
        run: dotnet restore src/Llavon.Lora.Cli/Llavon.Lora.Cli.csproj --configfile NuGet.Config --runtime linux-x64 -p:TorchBackend=rocm-linux
      - name: Publish the ROCm backend
        run: dotnet publish src/Llavon.Lora.Cli/Llavon.Lora.Cli.csproj -c Release --runtime linux-x64 --self-contained true --no-restore -p:TorchBackend=rocm-linux -o rocm-publish
      - run: ./rocm-publish/llavon-lora --version
      - run: ./rocm-publish/llavon-lora --help > /dev/null
      - name: Restore the CUDA backend
        run: dotnet restore src/Llavon.Lora.Cli/Llavon.Lora.Cli.csproj --configfile NuGet.Config --runtime linux-x64 -p:TorchBackend=cuda-linux-fetch
      - name: Publish the CUDA backend
        run: dotnet publish src/Llavon.Lora.Cli/Llavon.Lora.Cli.csproj -c Release --runtime linux-x64 --self-contained true --no-restore -p:TorchBackend=cuda-linux-fetch -o cuda-publish
      - run: ./cuda-publish/llavon-lora --version
      - run: ./cuda-publish/llavon-lora --help > /dev/null
      # The GPU assets must stay small: the libtorch is fetched at run time.
      - run: test "$(du -sm rocm-publish | cut -f1)" -lt 500
      - run: test "$(du -sm cuda-publish | cut -f1)" -lt 500
